# 아나(Ahna) 서버
# 이 폴더에서 처음 한 번: cp .env.example .env → .env를 채운 뒤
#   docker compose up -d --build
# 업데이트: 새 버전의 Ahna-Server.zip으로 이 폴더를 바꾼 뒤(.env는 그대로) 같은 명령을 다시 실행합니다.
# 서버는 127.0.0.1:45833 에서만 받습니다. 바깥(HTTPS)에서 들어오는 연결은 앞에 둔 Caddy(우분투)나
# NAS의 역방향 프록시가 이 주소로 넘겨 줍니다. 자세한 방법은 docs/서버-우분투.md · docs/서버-시놀로지.md
services:
  ahna:
    build: .
    image: ahna-relay:local
    container_name: ahna-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:45833:8080"
    environment:
      AHNA_ORIGIN: ${AHNA_ORIGIN:?.env에 AHNA_ORIGIN(서버 주소)을 넣으세요}
      AHNA_KEY: ${AHNA_KEY:?.env에 AHNA_KEY(64자리 임의 16진수)를 넣으세요}
      AHNA_INVITE: ${AHNA_INVITE:?.env에 AHNA_INVITE(초대 코드)를 넣으세요}
      AHNA_ADMIN_PASSWORD: ${AHNA_ADMIN_PASSWORD:-}   # 관리자 페이지 {서버}/_ahna/admin (비워 두면 꺼짐)
      AHNA_DOWNLOADS: ${AHNA_DOWNLOADS:-}             # 내려받기 화면 {서버}/download 에 보일 설치 파일 주소
      AHNA_PUBLISH_KEY: ${AHNA_PUBLISH_KEY:-}         # (선택) 서버에 앱 파일을 직접 올릴 때만
      TZ: ${TZ:-Asia/Seoul}                            # 하루 사용량이 바뀌는 시각(0시) 기준
    volumes:
      - ahna-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  ahna-data:
