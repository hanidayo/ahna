# 아나 빌드 · 배포
#
# Actions › release › Run workflow 로 실행합니다 (version: 1.0 처럼 X.Y).
#   publish=true  : 이 저장소의 Releases에 vX.Y를 만들고 설치 파일과 latest.json을 올립니다.
#                   설치된 앱들은 6시간마다 이 저장소의 latest.json을 확인해 새 버전을 알려 줍니다.
#   publish=false : 시험 빌드만 합니다(빌드가 되는지 확인, 파일은 남기지 않음).
#
# 비밀값(선택): ANDROID_KEYSTORE_BASE64 · ANDROID_KEY_PASSWORD
#   안드로이드 앱 서명 키입니다. 없으면 빌드할 때마다 새 키로 서명해서, 새 버전을 설치할 때
#   앱을 지우고 다시 설치해야 합니다. 만드는 방법은 docs/직접-빌드하기.md를 보세요.
# 비밀값(선택): APPLE_TEAM_ID — 아이폰 앱을 서명할 Apple 팀 ID(10자리). 없어도 됩니다.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0)"
        required: true
      publish:
        description: "true면 Releases에 게시, false면 시험 빌드만"
        required: false
        default: "true"
  workflow_call:
    inputs:
      version: { type: string, required: true }
      publish: { type: string, required: false, default: "false" }

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PYTHONUTF8: "1"          # Windows에서 한글 출력 오류 방지
  PYTHONIOENCODING: "utf-8"
  RELEASES_REPO: ${{ github.repository }}
  PUBLISH: ${{ inputs.publish }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: |
          v="${{ inputs.version }}"; v="${v#v}"; v="${v#V}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error::버전은 1.0 처럼 X.Y 형식으로 입력하세요: $v"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Releases에 vX.Y 초안 만들기
        if: ${{ env.PUBLISH == 'true' }}
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ steps.v.outputs.v }}" }
        run: |
          # 같은 버전을 다시 올리면 예전 릴리스를 지우고 새로 만듭니다.
          if gh release view "v$V" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release delete "v$V" -R "$RELEASES_REPO" --yes --cleanup-tag 2>&1 || gh release delete "v$V" -R "$RELEASES_REPO" --yes 2>&1 || echo "::warning::예전 릴리스를 지우지 못했습니다"
          fi
          gh release create "v$V" -R "$RELEASES_REPO" --draft --title "아나 $V" --notes "빌드 중…" --target "${{ github.sha }}"

  server:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.up.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/set_version.py "${{ needs.version.outputs.v }}"
      - uses: docker/setup-buildx-action@v3
      - name: 서버 이미지 빌드 확인
        uses: docker/build-push-action@v6
        env: { DOCKER_BUILD_RECORD_UPLOAD: "false" }
        with:
          context: server
          build-args: VERSION=${{ needs.version.outputs.v }}
          push: false
      - name: 서버 파일 묶기
        run: |
          mkdir -p dist
          cp -R server "$RUNNER_TEMP/ahna-server"
          rm -rf "$RUNNER_TEMP/ahna-server/Server/bin" "$RUNNER_TEMP/ahna-server/Server/obj"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/Ahna-Server.zip" ahna-server)
      - name: Releases에 올리기
        if: ${{ env.PUBLISH == 'true' }}
        id: up
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/release_asset.py dist/Ahna-Server.zip "${{ needs.version.outputs.v }}"

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      zip: ${{ steps.zip.outputs.asset }}
      setup: ${{ steps.setup.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "${{ env.DOTNET_VERSION }}" }
      - run: python scripts/set_version.py "${{ needs.version.outputs.v }}"
      - run: python scripts/set_repo.py
      - name: 빌드 (x64, 런타임 포함)
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.v }}"
          $pkg = "out/Ahna-$v-Windows"
          dotnet publish windows/Ahna.csproj -c Release -r win-x64 --self-contained true -o "$pkg/app" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\win-build.log"
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path "$env:RUNNER_TEMP\win-build.log" -Pattern "error " | Select-Object -ExpandProperty Line -Unique | Select-Object -First 30 | ForEach-Object { "::error::$_" }
            throw "publish 실패"
          }
          Copy-Item windows/package/* $pkg -Recurse -Force
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $pkg -DestinationPath "dist/Ahna-Windows.zip"
      - name: 설치 파일 하나 (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.v }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $app = (Resolve-Path "out/Ahna-$v-Windows/app").Path
          & $iscc /Qp "/DAppVersion=$v" "/DSourceDir=$app" "/O$PWD\dist" windows\installer\Ahna.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 만들기 실패" }
      - name: 자체 검사 (참고용)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.v }}"
          $p = Start-Process "out/Ahna-$v-Windows/app/AhnaOpen.exe" -ArgumentList "--self-test", "$env:RUNNER_TEMP\selftest" -Wait -PassThru
          "self-test exit: $($p.ExitCode)"
      - name: Releases에 올리기 (zip)
        if: ${{ env.PUBLISH == 'true' }}
        id: zip
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/release_asset.py dist/Ahna-Windows.zip "${{ needs.version.outputs.v }}"
      - name: Releases에 올리기 (설치 파일)
        if: ${{ env.PUBLISH == 'true' }}
        id: setup
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/release_asset.py dist/Ahna-Setup.exe "${{ needs.version.outputs.v }}"

  ios:
    needs: version
    runs-on: macos-15
    outputs:
      asset: ${{ steps.up.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: python3 scripts/set_version.py "${{ needs.version.outputs.v }}"
      - run: python3 scripts/set_repo.py
      - name: 서명 전 IPA
        working-directory: ios
        env:
          AHNA_SKIP_CHECKS: "1"
          AHNA_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          bash "IPA만들기.command" 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          st=${PIPESTATUS[0]}
          grep -E "error:" "$RUNNER_TEMP/ios-build.log" | sort -u | head -30 | sed 's/^/::error::/'
          exit $st
      - run: |
          mkdir -p dist
          cp "ios/dist/Ahna-${{ needs.version.outputs.v }}.ipa" dist/Ahna-iOS.ipa
      - name: Releases에 올리기
        if: ${{ env.PUBLISH == 'true' }}
        id: up
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/release_asset.py dist/Ahna-iOS.ipa "${{ needs.version.outputs.v }}"

  mac:
    needs: version
    runs-on: macos-15
    outputs:
      asset: ${{ steps.up.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "${{ env.DOTNET_VERSION }}" }
      - run: python3 scripts/set_version.py "${{ needs.version.outputs.v }}"
      - run: python3 scripts/set_repo.py
      - name: 수신 구성요소 (.NET, arm64 + x64)
        run: |
          set +e
          for rid in osx-arm64 osx-x64; do
            dotnet publish mac/Receiver/Ahna.MacReceiver.csproj -c Release -r $rid --self-contained true -o "mac/Backend/$rid" 2>&1 | tee -a "$RUNNER_TEMP/mac-dotnet.log"
            st=${PIPESTATUS[0]}
            if [ $st -ne 0 ]; then grep -E "error " "$RUNNER_TEMP/mac-dotnet.log" | sort -u | head -30 | sed 's/^/::error::/'; exit $st; fi
            echo "${{ needs.version.outputs.v }}" > "mac/Backend/$rid/ahna-backend-version.txt"
          done
      - name: 앱 + 공유 확장
        run: |
          set +e
          bash mac/build-mac.sh 2>&1 | tee "$RUNNER_TEMP/mac-build.log"
          st=${PIPESTATUS[0]}
          grep -E "error:" "$RUNNER_TEMP/mac-build.log" | sort -u | head -30 | sed 's/^/::error::/'
          exit $st
      - run: |
          mkdir -p dist
          ditto -c -k --keepParent "mac/dist/AhnaOpen.app" dist/Ahna-Mac.zip
      - name: Releases에 올리기
        if: ${{ env.PUBLISH == 'true' }}
        id: up
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/release_asset.py dist/Ahna-Mac.zip "${{ needs.version.outputs.v }}"

  android:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.up.outputs.asset }}
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      AHNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: python3 scripts/set_version.py "${{ needs.version.outputs.v }}"
      - run: python3 scripts/set_repo.py
      - name: 서명 키
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ahna.keystore"; exit 0; fi
          echo "::warning::비밀값 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD가 없어 이번 빌드만 쓰는 임시 키로 서명합니다. 새 버전을 설치할 때 앱을 지우고 다시 설치해야 합니다(docs/직접-빌드하기.md 참고)."
          pass="$(openssl rand -hex 16)"; echo "::add-mask::$pass"; echo "AHNA_KEY_PASSWORD=$pass" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ahna.keystore" -storetype PKCS12 -alias ahna -keyalg RSA -keysize 2048 -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Ahna" >/dev/null
      - name: APK
        run: |
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          python3 android/build_apk.py --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME" --keystore "$RUNNER_TEMP/ahna.keystore" --alias ahna 2>&1 | tee "$RUNNER_TEMP/android.log"
          st=${PIPESTATUS[0]}
          grep -E "error:|Error:" "$RUNNER_TEMP/android.log" | sort -u | head -30 | sed 's/^/::error::/'
          [ $st -eq 0 ] || exit $st
          mkdir -p dist
          cp "android/app/build/manual/Ahna-${{ needs.version.outputs.v }}-Android.apk" dist/Ahna-Android.apk
      - name: Releases에 올리기
        if: ${{ env.PUBLISH == 'true' }}
        id: up
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/release_asset.py dist/Ahna-Android.apk "${{ needs.version.outputs.v }}"

  publish:
    needs: [version, server, windows, ios, mac, android]
    if: ${{ inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latest.json 만들기
        env:
          WINDOWS: ${{ needs.windows.outputs.zip }}
          WINDOWS_SETUP: ${{ needs.windows.outputs.setup }}
          IOS: ${{ needs.ios.outputs.asset }}
          MAC: ${{ needs.mac.outputs.asset }}
          ANDROID: ${{ needs.android.outputs.asset }}
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.v }}
          NOTES_URL: https://github.com/${{ github.repository }}/releases/latest
        run: python3 scripts/make_manifest.py "${{ needs.version.outputs.v }}" dist/latest.json
      - name: 릴리스 공개 (설명 + latest.json)
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.version.outputs.v }}" }
        run: |
          gh release upload "v$V" dist/latest.json --clobber -R "$RELEASES_REPO"
          sed -e "s/{VERSION}/$V/g" -e "s#{REPO}#$RELEASES_REPO#g" docs/릴리스-설명.md > "$RUNNER_TEMP/notes.md"
          gh release edit "v$V" -R "$RELEASES_REPO" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest
