# 파일 고르기 시험 앱(아나와 무관): 설치 환경 문제인지 가르기. IPA는 배포 저장소의 picker-test 사전 릴리스에 올립니다.
name: picker-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: 빌드
        run: |
          set -e
          app=build/Payload/PickerTest.app; mkdir -p "$app"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc -parse-as-library -O -sdk "$sdk" -target arm64-apple-ios17.0 ios/PickerTest/PickerTest.swift -o "$app/PickerTest"
          cp ios/PickerTest/Info.plist "$app/Info.plist"
          plutil -convert binary1 "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          cat > build/ent.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>application-identifier</key><string>6PHYY26T68.com.hanidayo.pickertest</string><key>com.apple.developer.team-identifier</key><string>6PHYY26T68</string></dict></plist>
          PL
          codesign --force --sign - --timestamp=none --entitlements build/ent.plist "$app"
          (cd build && zip -qry ../PickerTest.ipa Payload)
          ls -l PickerTest.ipa
      - name: 배포 저장소의 picker-test 사전 릴리스에 올리기
        env: { GH_TOKEN: "${{ secrets.RELEASES_TOKEN }}" }
        run: |
          R=hanidayo/ahna-releases
          gh release view picker-test -R $R >/dev/null 2>&1 || gh release create picker-test -R $R --prerelease --title "파일 고르기 시험 앱" --notes "아나와 무관한 시험용 앱입니다."
          gh release upload picker-test PickerTest.ipa --clobber -R $R
